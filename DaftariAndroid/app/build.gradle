
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.behzad.daftari2'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.behzad.daftari2'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '10.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
